name: CI

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build.yml'
      - '.github/workflows/ci.yml'
      - 'config/**'
      - 'scripts/**'
      - 'tests/**'
      - 'release-notes/**'
      - 'dependencies.lock.json'
      - 'LICENSE.MD'
      - 'LICENSES/**'
      - 'README.md'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      home_changed: ${{ steps.metadata.outputs.home_changed }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Detect Home integration changes
        id: metadata
        env:
          BASE_SHA: ${{ github.event.before }}
        run: >-
          python3 scripts/home_ci_metadata.py
          --base "$BASE_SHA"
          --github-output "$GITHUB_OUTPUT"

  project-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v

  warm-home-macos-x64:
    needs:
      - changes
      - project-tests
    if: needs.changes.outputs.home_changed == 'true'
    runs-on: macos-15-intel
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.cache/cargo-target/home/macos-x64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0
      - name: Read Home cache metadata
        id: home-metadata
        run: >-
          python3 scripts/home_ci_metadata.py
          --github-output "$GITHUB_OUTPUT"
      - name: Restore Home release dependencies
        id: home-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            .cache/cargo-target/home/macos-x64/.rustc_info.json
            .cache/cargo-target/home/macos-x64/x86_64-apple-darwin/release/.fingerprint
            .cache/cargo-target/home/macos-x64/x86_64-apple-darwin/release/build
            .cache/cargo-target/home/macos-x64/x86_64-apple-darwin/release/deps
          key: home-release-v1-macos-x64-rust1.92.0-${{ steps.home-metadata.outputs.home_commit }}-${{ steps.home-metadata.outputs.home_source_sha256 }}-${{ steps.home-metadata.outputs.home_build_sha256 }}-${{ steps.home-metadata.outputs.project_version }}
          restore-keys: |
            home-release-v1-macos-x64-rust1.92.0-${{ steps.home-metadata.outputs.home_commit }}-${{ steps.home-metadata.outputs.home_source_sha256 }}-${{ steps.home-metadata.outputs.home_build_sha256 }}-
      - name: Build Home release dependencies
        if: steps.home-cache.outputs.cache-hit != 'true'
        run: |
          python3 scripts/fetch_dependencies.py \
            --component mpv_enjoy_home \
            --extract mpv_enjoy_home=build/sources/mpv-enjoy-home \
            --force-extract
          python3 scripts/build_home.py \
            --mode package \
            --platform macos-x64 \
            --source build/sources/mpv-enjoy-home \
            --output build/home/macos-x64/mpv-enjoy.app \
            --metadata-output build/home/macos-x64/metadata
          cargo clean \
            --manifest-path build/sources/mpv-enjoy-home/src-tauri/Cargo.toml \
            --package mpv-enjoy-home \
            --release \
            --target x86_64-apple-darwin
      - name: Save Home release dependencies
        if: steps.home-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            .cache/cargo-target/home/macos-x64/.rustc_info.json
            .cache/cargo-target/home/macos-x64/x86_64-apple-darwin/release/.fingerprint
            .cache/cargo-target/home/macos-x64/x86_64-apple-darwin/release/build
            .cache/cargo-target/home/macos-x64/x86_64-apple-darwin/release/deps
          key: home-release-v1-macos-x64-rust1.92.0-${{ steps.home-metadata.outputs.home_commit }}-${{ steps.home-metadata.outputs.home_source_sha256 }}-${{ steps.home-metadata.outputs.home_build_sha256 }}-${{ steps.home-metadata.outputs.project_version }}

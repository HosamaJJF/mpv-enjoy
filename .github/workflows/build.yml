name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
      - '!main'
    tags:
      - 'v*'
    paths:
      - '.github/workflows/build.yml'
      - '.github/workflows/ci.yml'
      - 'config/**'
      - 'scripts/**'
      - 'tests/**'
      - 'release-notes/**'
      - 'dependencies.lock.json'
      - 'LICENSE.MD'
      - 'LICENSES/**'
      - 'README.md'

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      home_changed: ${{ steps.metadata.outputs.home_changed }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Detect Home integration changes
        id: metadata
        env:
          BASE_SHA: ${{ github.event.before }}
        run: |
          arguments=()
          if [[ -n "$BASE_SHA" ]]; then
            arguments+=(--base "$BASE_SHA")
          fi
          python3 scripts/home_ci_metadata.py \
            "${arguments[@]}" \
            --github-output "$GITHUB_OUTPUT"

  project-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v

  home-quality:
    needs: changes
    if: startsWith(github.ref, 'refs/tags/v') || needs.changes.outputs.home_changed == 'true'
    name: home-quality-${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-2025
          - platform: macos-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0
          components: rustfmt, clippy
      - name: Extract Home source
        run: >-
          python scripts/fetch_dependencies.py
          --component mpv_enjoy_home
          --extract mpv_enjoy_home=build/sources/mpv-enjoy-home
          --force-extract
      - name: Home quality checks
        run: >-
          python scripts/build_home.py
          --mode checks
          --platform ${{ matrix.platform }}
          --source build/sources/mpv-enjoy-home

  windows-x64:
    runs-on: windows-2025
    environment: release-credentials
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.cache/cargo-target/home/windows-x64
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0
          targets: x86_64-pc-windows-msvc
      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            git
            file
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-ffmpeg
            mingw-w64-clang-x86_64-go
            mingw-w64-clang-x86_64-libarchive
            mingw-w64-clang-x86_64-libass
            mingw-w64-clang-x86_64-libjpeg-turbo
            mingw-w64-clang-x86_64-libplacebo
            mingw-w64-clang-x86_64-luajit
            mingw-w64-clang-x86_64-lcms2
            mingw-w64-clang-x86_64-meson
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-pkgconf
            mingw-w64-clang-x86_64-python
            mingw-w64-clang-x86_64-uchardet
            mingw-w64-clang-x86_64-vulkan-headers
      - uses: actions/cache@v6
        with:
          path: .cache/downloads
          key: mpv-enjoy-downloads-windows-x64-${{ hashFiles('dependencies.lock.json') }}
          restore-keys: |
            mpv-enjoy-downloads-windows-x64-
      - name: Build Home application shell
        shell: pwsh
        run: |
          python scripts/fetch_dependencies.py `
            --component mpv_enjoy_home `
            --extract mpv_enjoy_home=build/sources/mpv-enjoy-home `
            --force-extract
          python scripts/build_home.py `
            --mode package `
            --platform windows-x64 `
            --source build/sources/mpv-enjoy-home `
            --output build/home/windows-x64/mpv-enjoy.exe `
            --metadata-output build/home/windows-x64/metadata
      - name: Build and package
        env:
          MPV_ENJOY_DANDANPLAY_APP_ID_AES_B64: ${{ secrets.MPV_ENJOY_DANDANPLAY_APP_ID_AES_B64 }}
          MPV_ENJOY_DANDANPLAY_APP_SECRET_AES_B64: ${{ secrets.MPV_ENJOY_DANDANPLAY_APP_SECRET_AES_B64 }}
        run: bash scripts/build-windows-msys2.sh
      - uses: actions/upload-artifact@v7
        with:
          name: mpv-enjoy-windows-x64
          path: |
            dist/mpv-enjoy-1.2.2-windows-x64.zip
            dist/SHA256SUMS
          if-no-files-found: error

  macos:
    name: ${{ matrix.platform }}
    environment: release-credentials
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            runner: macos-15
          - platform: macos-x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.cache/cargo-target/home/${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache: false
      - name: Read Home cache metadata
        id: home-metadata
        run: >-
          python3 scripts/home_ci_metadata.py
          --github-output "$GITHUB_OUTPUT"
      - name: Restore macOS Intel Home release dependencies
        if: matrix.platform == 'macos-x64'
        uses: actions/cache/restore@v6
        with:
          path: |
            .cache/cargo-target/home/macos-x64/.rustc_info.json
            .cache/cargo-target/home/macos-x64/x86_64-apple-darwin/release/.fingerprint
            .cache/cargo-target/home/macos-x64/x86_64-apple-darwin/release/build
            .cache/cargo-target/home/macos-x64/x86_64-apple-darwin/release/deps
          key: home-release-v1-macos-x64-rust1.92.0-${{ steps.home-metadata.outputs.home_commit }}-${{ steps.home-metadata.outputs.home_source_sha256 }}-${{ steps.home-metadata.outputs.home_build_sha256 }}-${{ steps.home-metadata.outputs.project_version }}
          restore-keys: |
            home-release-v1-macos-x64-rust1.92.0-${{ steps.home-metadata.outputs.home_commit }}-${{ steps.home-metadata.outputs.home_source_sha256 }}-${{ steps.home-metadata.outputs.home_build_sha256 }}-
      - uses: actions/cache@v6
        with:
          path: .cache/downloads
          key: mpv-enjoy-downloads-${{ matrix.platform }}-${{ hashFiles('dependencies.lock.json') }}
          restore-keys: |
            mpv-enjoy-downloads-${{ matrix.platform }}-
      - name: Install native build dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: >-
          brew install
          autoconf automake pkgconf libtool python freetype fribidi little-cms2 libarchive
          luajit libass ffmpeg meson uchardet mujs libplacebo
          molten-vk vulkan-loader vulkan-headers
      - name: Build Home application shell
        run: |
          python3 scripts/fetch_dependencies.py \
            --component mpv_enjoy_home \
            --extract mpv_enjoy_home=build/sources/mpv-enjoy-home \
            --force-extract
          python3 scripts/build_home.py \
            --mode package \
            --platform "${{ matrix.platform }}" \
            --source build/sources/mpv-enjoy-home \
            --output "build/home/${{ matrix.platform }}/mpv-enjoy.app" \
            --metadata-output "build/home/${{ matrix.platform }}/metadata"
      - name: Build, ad-hoc sign and package
        env:
          MPV_ENJOY_DANDANPLAY_APP_ID_AES_B64: ${{ secrets.MPV_ENJOY_DANDANPLAY_APP_ID_AES_B64 }}
          MPV_ENJOY_DANDANPLAY_APP_SECRET_AES_B64: ${{ secrets.MPV_ENJOY_DANDANPLAY_APP_SECRET_AES_B64 }}
        run: bash scripts/build-macos.sh ${{ matrix.platform }}
      - uses: actions/upload-artifact@v7
        with:
          name: mpv-enjoy-${{ matrix.platform }}
          path: |
            dist/mpv-enjoy-1.2.2-${{ matrix.platform }}.dmg
            dist/SHA256SUMS
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - project-tests
      - home-quality
      - windows-x64
      - macos
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Download CI artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts/windows-x64 artifacts/macos-arm64 artifacts/macos-x64
          gh run download "$GITHUB_RUN_ID" \
            --name mpv-enjoy-windows-x64 \
            --dir artifacts/windows-x64
          gh run download "$GITHUB_RUN_ID" \
            --name mpv-enjoy-macos-arm64 \
            --dir artifacts/macos-arm64
          gh run download "$GITHUB_RUN_ID" \
            --name mpv-enjoy-macos-x64 \
            --dir artifacts/macos-x64
      - name: Verify and collect release assets
        run: |
          expected_tag="v$(jq -r '.project_version' dependencies.lock.json)"
          if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match project version $expected_tag" >&2
            exit 1
          fi
          for platform in windows-x64 macos-arm64 macos-x64
          do
            (
              cd "artifacts/$platform"
              sha256sum --check SHA256SUMS
            )
          done
          mkdir release-assets
          cp artifacts/windows-x64/mpv-enjoy-1.2.2-windows-x64.zip release-assets/
          cp artifacts/macos-arm64/mpv-enjoy-1.2.2-macos-arm64.dmg release-assets/
          cp artifacts/macos-x64/mpv-enjoy-1.2.2-macos-x64.dmg release-assets/
          (
            cd release-assets
            sha256sum mpv-enjoy-* > SHA256SUMS
          )
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_title="mpv-enjoy ${GITHUB_REF_NAME#v}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" \
              --draft \
              --title "$release_title" \
              --notes-file "release-notes/$GITHUB_REF_NAME.md"
          else
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --draft \
              --title "$release_title" \
              --notes-file "release-notes/$GITHUB_REF_NAME.md"
          fi
          gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false

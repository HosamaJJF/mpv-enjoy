name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
    paths:
      - '.github/workflows/build.yml'
      - 'config/**'
      - 'scripts/**'
      - 'tests/**'
      - 'release-notes/**'
      - 'dependencies.lock.json'

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-2025
    environment: release-credentials
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v6
      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            git
            file
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-ffmpeg
            mingw-w64-clang-x86_64-go
            mingw-w64-clang-x86_64-libarchive
            mingw-w64-clang-x86_64-libass
            mingw-w64-clang-x86_64-libjpeg-turbo
            mingw-w64-clang-x86_64-libplacebo
            mingw-w64-clang-x86_64-luajit
            mingw-w64-clang-x86_64-lcms2
            mingw-w64-clang-x86_64-meson
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-pkgconf
            mingw-w64-clang-x86_64-python
            mingw-w64-clang-x86_64-uchardet
            mingw-w64-clang-x86_64-vulkan-headers
      - uses: actions/cache@v6
        with:
          path: .cache/downloads
          key: mpv-enjoy-downloads-windows-x64-${{ hashFiles('dependencies.lock.json') }}
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Build and package
        env:
          MPV_ENJOY_DANDANPLAY_APP_ID_AES_B64: ${{ secrets.MPV_ENJOY_DANDANPLAY_APP_ID_AES_B64 }}
          MPV_ENJOY_DANDANPLAY_APP_SECRET_AES_B64: ${{ secrets.MPV_ENJOY_DANDANPLAY_APP_SECRET_AES_B64 }}
        run: bash scripts/build-windows-msys2.sh
      - uses: actions/upload-artifact@v7
        with:
          name: mpv-enjoy-windows-x64
          path: |
            dist/mpv-enjoy-1.1.2-windows-x64.zip
            dist/SHA256SUMS
          if-no-files-found: error

  macos:
    name: ${{ matrix.platform }}
    environment: release-credentials
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            runner: macos-15
          - platform: macos-x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache: false
      - uses: actions/cache@v6
        with:
          path: .cache/downloads
          key: mpv-enjoy-downloads-${{ matrix.platform }}-${{ hashFiles('dependencies.lock.json') }}
      - name: Install native build dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: >-
          brew install
          autoconf automake pkgconf libtool python freetype fribidi little-cms2 libarchive
          luajit libass ffmpeg meson rust uchardet mujs libplacebo
          molten-vk vulkan-loader vulkan-headers
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Build, ad-hoc sign and package
        env:
          MPV_ENJOY_DANDANPLAY_APP_ID_AES_B64: ${{ secrets.MPV_ENJOY_DANDANPLAY_APP_ID_AES_B64 }}
          MPV_ENJOY_DANDANPLAY_APP_SECRET_AES_B64: ${{ secrets.MPV_ENJOY_DANDANPLAY_APP_SECRET_AES_B64 }}
        run: bash scripts/build-macos.sh ${{ matrix.platform }}
      - uses: actions/upload-artifact@v7
        with:
          name: mpv-enjoy-${{ matrix.platform }}
          path: |
            dist/mpv-enjoy-1.1.2-${{ matrix.platform }}.dmg
            dist/SHA256SUMS
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - windows-x64
      - macos
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Download CI artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts/windows-x64 artifacts/macos-arm64 artifacts/macos-x64
          gh run download "$GITHUB_RUN_ID" \
            --name mpv-enjoy-windows-x64 \
            --dir artifacts/windows-x64
          gh run download "$GITHUB_RUN_ID" \
            --name mpv-enjoy-macos-arm64 \
            --dir artifacts/macos-arm64
          gh run download "$GITHUB_RUN_ID" \
            --name mpv-enjoy-macos-x64 \
            --dir artifacts/macos-x64
      - name: Verify and collect release assets
        run: |
          expected_tag="v$(jq -r '.project_version' dependencies.lock.json)"
          if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match project version $expected_tag" >&2
            exit 1
          fi
          for platform in windows-x64 macos-arm64 macos-x64
          do
            (
              cd "artifacts/$platform"
              sha256sum --check SHA256SUMS
            )
          done
          mkdir release-assets
          cp artifacts/windows-x64/mpv-enjoy-1.1.2-windows-x64.zip release-assets/
          cp artifacts/macos-arm64/mpv-enjoy-1.1.2-macos-arm64.dmg release-assets/
          cp artifacts/macos-x64/mpv-enjoy-1.1.2-macos-x64.dmg release-assets/
          (
            cd release-assets
            sha256sum mpv-enjoy-* > SHA256SUMS
          )
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_title="mpv-enjoy ${GITHUB_REF_NAME#v}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" \
              --draft \
              --title "$release_title" \
              --notes-file "release-notes/$GITHUB_REF_NAME.md"
          else
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --draft \
              --title "$release_title" \
              --notes-file "release-notes/$GITHUB_REF_NAME.md"
          fi
          gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false

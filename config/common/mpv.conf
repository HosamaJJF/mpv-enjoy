# mpv-lazy-enjoy managed defaults. Put personal overrides in ~~/user.conf.
input-conf=~~/input.conf
include=~~/profiles.conf
include=~~/platform.conf
include=~~/user.conf

# Player and window
vo=gpu-next
hwdec=auto
idle=yes
keep-open=yes
save-position-on-quit=yes
watch-later-options=start,vid,aid,sid
watch-later-directory=~~/state/watch_later
autofit-smaller=50%x50%
keepaspect-window=no
input-builtin-bindings=no
input-ime=yes

# Cache and playback
demuxer-max-bytes=1024MiB
demuxer-max-back-bytes=512MiB
demuxer-cache-dir=~~/cache
icc-cache-dir=~~/cache/icc
gpu-shader-cache-dir=~~/cache/gpu
video-sync=display-resample
interpolation=yes
hr-seek-framedrop=no

# Scaling uses only mpv/libplacebo built-ins. No external GPU-specific shaders.
scale=spline36
cscale=bilinear
dscale=bicubic
sigmoid-upscaling=no
correct-downscaling=no
deinterlace=auto
hdr-peak-percentile=99.99

# Audio
volume=100
volume-max=130
audio-channels=auto-safe
audio-file-auto=fuzzy

# OSD and uosc
osc=no
osd-on-seek=msg
osd-bar-w=100
osd-bar-h=1.8
osd-bar-align-y=-1
osd-color="#672168"
osd-outline-color="#EEEEEE"
osd-outline-size=0.8
osd-font-size=38
osd-fractions=yes
osd-playing-msg=${filename}
osd-duration=2000
osd-playing-msg-duration=3000

# Online playback
ytdl=yes
ytdl-raw-options-append=sub-langs=-danmaku
script-opts-append=ytdl_hook-ytdl_path=yt-dlp

# Script defaults
script-opts-append=console-font_size=16
script-opts-append=console-scale_with_window=no
script-opts-append=stats-duration=2
script-opts-append=stats-redraw_delay=0.5
script-opts-append=stats-persistent_overlay=yes
script-opts-append=thumbfast-min_duration=30

# Subtitles
sub-auto=fuzzy
sub-codepage=GB18030
slang=chs,sc,zh-cn,chi,zh,zh-tw,cht,zho,ze
subs-fallback=yes
sub-font-size=44
sub-scale-signs=yes
sub-outline-size=4
sub-blur=1
sub-color="#FFD766"
sub-use-margins=yes
sub-ass-force-margins=yes

# Screenshots
screenshot-format=png
screenshot-png-compression=4
screenshot-tag-colorspace=no
screenshot-high-bit-depth=no
screenshot-template=~~desktop/MPV-%P-N%n

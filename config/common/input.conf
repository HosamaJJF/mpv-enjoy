# Playback and seeking
SPACE             cycle pause
,                 frame-back-step
.                 frame-step
l                 ab-loop
LEFT              seek -5 ; script-message-to uosc flash-elements timeline
RIGHT             seek 5 ; script-message-to uosc flash-elements timeline
UP                set pause yes ; seek -1 exact ; script-message-to uosc flash-elements timeline
DOWN              set pause yes ; seek 1 exact ; script-message-to uosc flash-elements timeline
REWIND            seek -30 ; script-message-to uosc flash-elements timeline
FORWARD           seek 30 ; script-message-to uosc flash-elements timeline

# Speed and volume
[                 no-osd cycle-values speed 2 1.5 1.2 1 ; script-message-to uosc flash-elements speed
]                 no-osd cycle-values speed 1 1.2 1.5 2 ; script-message-to uosc flash-elements speed
{                 no-osd add speed -0.1 ; script-message-to uosc flash-elements speed
}                 no-osd add speed 0.1 ; script-message-to uosc flash-elements speed
-                 no-osd add volume -1 ; script-message-to uosc flash-elements volume
=                 no-osd add volume 1 ; script-message-to uosc flash-elements volume

# Audio and subtitle timing
c                 add audio-delay -0.1
v                 add audio-delay 0.1
z                 add sub-delay -0.1
x                 add sub-delay 0.1
Shift+BS          set audio-delay 0 ; set sub-delay 0

# Video equalizer
1                 add contrast -1
2                 add contrast 1
3                 add brightness -1
4                 add brightness 1
5                 add gamma -1
6                 add gamma 1
7                 add saturation -1
8                 add saturation 1
9                 add hue -1
0                 add hue 1
Ctrl+BS           set contrast 0 ; set brightness 0 ; set gamma 0 ; set saturation 0 ; set hue 0

# uosc and tools
Ctrl+Shift+v      script-binding uosc/paste-to-open
Ctrl+s            async screenshot
Ctrl+i            script-binding uosc/keybinds
i                 script-binding stats/display-stats
I                 script-binding stats/display-stats-toggle
`                 script-binding console/enable
Ctrl+UP           script-binding uosc/prev
Ctrl+DOWN         script-binding uosc/next
PREV              script-binding uosc/prev
NEXT              script-binding uosc/next

# Window and mouse
ESC               set fullscreen no
ENTER             set fullscreen yes
Alt+ENTER         cycle fullscreen
MBTN_BACK         script-binding uosc/prev
MBTN_FORWARD      script-binding uosc/next
MBTN_LEFT         ignore
MBTN_LEFT_DBL     cycle fullscreen
MBTN_MID          script-binding uosc/menu
MBTN_RIGHT        script-binding uosc/menu
Ctrl+MBTN_RIGHT   context-menu
MBTN_RIGHT_DBL    ignore
Alt+WHEEL_DOWN    add video-zoom -0.1
Alt+WHEEL_UP      add video-zoom 0.1
BS                set video-zoom 0 ; set panscan 0 ; set video-pan-x 0 ; set video-pan-y 0 ; set video-align-x 0 ; set video-align-y 0

# Exit
Ctrl+q            quit
POWER             quit
STOP              stop
PLAY              set pause no
PAUSE             set pause yes
PLAYPAUSE         cycle pause

# Network services
api_server=https://api.dandanplay.net
fallback_server=https://api.danmu.icu
proxy=
cookie_file=

# Conservative defaults: search manually first, then reuse the association history.
auto_load=no
autoload_local_danmaku=no
autoload_for_url=no
save_danmaku=no
save_danmaku_path=
save_danmaku_path_mode=local
history_path=~~/danmaku-history.json

# Keys are registered by uosc_danmaku itself.
open_search_danmaku_menu_key=Ctrl+d
show_danmaku_keyboard_key=j

# Rendering
vf_fps=no
fps=60/1.001
merge_tolerance=-1
merge_without_style=no
chConvert=0
scrolltime=15
fixtime=5
fontname=sans-serif
fontsize=50
shadow=0
bold=yes
opacity=0.7
displayarea=0.85
outline=1.0
max_screen_danmaku=0
blacklist_path=
